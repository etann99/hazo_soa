n      return {\n        x: r1(n.x - n.w / 2), y: r1(n.y - n.h / 2), w: r1(n.w), h: n.h, rx: n.h / 2,\n        tx: r1(n.x), ty: r1(n.y + (n.big ? 5 : 4.5)), fs: n.big ? 14 : 12.5, t: this.ts(n.t || ''),\n        cls: (n.big ? 'big ' : '') + (selN === n.id ? 'sel ' : '') + (from === n.id ? 'from' : ''),\n        down: editable ? (e) => this.nodeDown(e, n.id) : () => {}\n      };\n    });\n    return { lines: lines, nodes: out };\n  }\n  nodeDown(e, id) {\n    this._hit = true;\n    const st = this.state;\n    if (st.sMode === 'link') {\n      if (!st.sFrom) { this.setState({ sFrom: id, sSelN: id, sSelL: '' }); return; }\n      if (st.sFrom === id) { this.setState({ sFrom: '' }); return; }\n      const ex = st.sLinks.filter((l) => (l.a === st.sFrom && l.b === id) || (l.a === id && l.b === st.sFrom))[0];\n      if (ex) { this.setState({ sSelL: ex.id, sSelN: '', sFrom: '' }); return; }\n      const lid = 'l' + st.sNext;\n      this.schSet({ sLinks: st.sLinks.concat([{ id: lid, a: st.sFrom, b: id, dir: 0, label: '' }]), sNext: st.sNext + 1, sSelL: lid, sSelN: '', sFrom: '' });\n      return;\n    }\n    const n = st.sNodes.filter((x) => x.id === id)[0];\n    if (!n) return;\n    const p = this.schPt(e);\n    this._drag = { id: id, dx: n.x - p[0], dy: n.y - p[1], moved: false, snap: JSON.stringify({ nodes: st.sNodes, links: st.sLinks }) };\n    if (e.currentTarget && e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } }\n    this.setState({ sSelN: id, sSelL: '', sFrom: '' });\n  }\n  linkDown(e, id) {\n    this._hit = true;\n    this.setState({ sSelL: id, sSelN: '', sFrom: '' });\n  }\n\n  /* remonter d'un niveau : feuille, branche, branches, arbre ; radicelle, racine, racines, arbre ; fleur, branche ou tronc, arbre */\n  zoomOut() {\n    const s = this.state;\n    const g = this.buildGeo();\n    const sel = s.sel;\n    if (s.section === 'arbre' && sel) {\n      let next = '';\n      if (sel.indexOf('leaf:') === 0) {\n        const d = g.leafData.filter((x) => 'leaf:' + x.id === sel)[0];\n        next = d && d.dom !== 'socle' ? 'branch:' + d.dom : 'trunk';\n      } else if (sel.indexOf('branch:') === 0) {\n        this.setState({ section: 'branches', sel: '' });\n        return;\n      } else if (sel.indexOf('rl:') === 0) {\n        const rt = this.rootsData().filter((r) => r.items.some((x) => 'rl:' + x.id === sel))[0];\n        next = rt ? 'root:' + rt.k.slice(1) : '';\n      } else if (sel.indexOf('root:') === 0) {\n        this.setState({ section: 'racines', sel: '' });\n        return;\n      } else if (sel.indexOf('flower:') === 0) {\n        const c = s.creations.filter((x) => 'flower:' + x.id === sel)[0];\n        const a = c ? c.anchor : '';\n        next = a === 'socle' ? 'trunk' : ['A', 'B', 'C', 'D', 'E', 'F', 'G'].indexOf(a) >= 0 ? 'branch:' + a : '';\n      }\n      this.setState({ sel: next });\n      return;\n    }\n    if (s.section === 'fruits' && s.fSel) {\n      this.setState({ fSel: '', fProj: '', fStep: '' });\n      return;\n    }\n    if (s.section !== 'arbre') this.setState({ section: 'arbre', sel: '' });\n  }\n\n  animateVB(to) {\n    const el = typeof document !== 'undefined' ? document.querySelector('svg.tree') : null;\n    const from = this._cur || [20, 40, 760, 950];\n    if (typeof cancelAnimationFrame !== 'undefined') cancelAnimationFrame(this._raf);\n    const done = () => { this._cur = to; this.setState({ vb: to.map((v) => Math.round(v * 10) / 10).join(' ') }); };\n    if (!el || typeof requestAnimationFrame === 'undefined' || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) { done(); return; }\n    const t0 = performance.now(), dur = 850;\n    const step = (t) => {\n      const k = Math.min(1, (t - t0) / dur);\n      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;\n      const v = from.map((a, i) => a + (to[i] - a) * e);\n      el.setAttribute('viewBox', v.join(' '));\n      this._cur = v;\n      if (k < 1) this._raf = requestAnimationFrame(step); else done();\n    };\n    this._raf = requestAnimationFrame(step);\n  }\n\n  /* ---------- contenus ---------- */\n  contents() {\n    if (this._c) return this._c;\n    const tr = (step, fmt, title, mg, who, q, cap, apport, place, amorce, vocab, extra) => Object.assign({\n      dom: 'socle', step: step, fmt: fmt, title: title, mg: mg, who: who, q: q,\n      sum: cap,\n      secs: [['Ce que le contenu apporte', apport]],\n      amorce: amorce, vocab: vocab, fig: fmt.indexOf('Vidéo') === 0 ? 'video' : '', figCap: '', dial: ''\n    }, extra || {});\n    const idee = (dom, title, mg, q, a, b, c, amorce, vocab, extra) => Object.assign({\n      dom: dom, step: '', fmt: 'Idée fondatrice', title: title, mg: mg, who: '', q: q,\n      sum: a.split('.')[0] + '.',\n      secs: [['Ce qui reste vrai partout', a], ['Ce qui varie selon les pays et les époques', b], ['Exemples, du monde et de Madagascar', c]],\n      amorce: amorce, vocab: vocab, fig: '', figCap: '', dial: ''\n    }, extra || {});\n    const ext = (dom, fmt, title, mg, who, q, apport, comprendre, amorce, vocab, extra) => Object.assign({\n      dom: dom, step: '', fmt: fmt, title: title, mg: mg, who: who, q: q,\n      sum: apport.split('.')[0] + '.',\n      secs: [['Ce que le contenu apporte', apport], ['Ce qu’il permet de comprendre', comprendre]],\n      amorce: amorce, vocab: vocab, fig: fmt.indexOf('Vidéo') === 0 ? 'video' : '', figCap: '', dial: ''\n    }, extra || {});\n\n    this._c = [\n      /* ---------------- Tronc : parcours en cinq étapes ---------------- */\n      tr('Observer', 'Extrait de texte', 'Traité de radioactivité', 'Boky momba ny radioaktivita', 'Marie Curie, Europe',\n        'Comment observer avec exactitude ce qu’on ne voit pas ?', 'Observer avec exactitude.',\n        'En mesurant avec soin l’activité de minerais d’uranium, Marie Curie remarque qu’un minerai est plus actif que l’uranium qu’il contient. Cet écart, pris au sérieux, la conduit à chercher de nouveaux éléments : le polonium et le radium, annoncés en 1898.',\n        'Premier pas du parcours : regarder avant d’expliquer.',\n        'Choisissez un objet familier et décrivez-le en dix observations, sans aucun mot d’opinion.',\n        [['fandrefesana', 'mesure'], ['radioaktivita', 'radioactivité']]),\n      tr('Observer', 'Exercice guidé', 'Lire un texte avec précision', 'Mamaky lahatsoratra amin’ny fitandremana', '',\n        'Que dit exactement ce texte, et que ne dit-il pas ?', 'Lire un texte avec précision.',\n        'Un paragraphe court, relu trois fois : une première lecture pour ce qui est écrit, une deuxième pour ce qu’on peut conclure avec certitude, une troisième pour ce qu’on suppose sans que le texte le dise.',\n        'Prépare à distinguer un fait d’une opinion.',\n        'Soulignez dans un article de journal les phrases qui affirment un fait, puis celles qui expriment un avis.',\n        [['famakiana', 'lecture'], ['soratra', 'texte, écrit']]),\n      tr('Comprendre', 'Extrait de texte', 'Règles pour philosopher', 'Fitsipika amin’ny fisainana', 'Isaac Newton, Europe',\n        'Comment décider qu’une explication est assez bonne ?', 'Comprendre comment les choses fonctionnent.',\n        'Dans les Principia, Newton énonce des règles de raisonnement : ne pas admettre plus de causes que celles qui sont vraies et suffisantes pour expliquer les phénomènes, et attribuer aux mêmes effets les mêmes causes. C’est un outil pour choisir entre plusieurs explications.',\n        'Suit l’observation : une fois les faits notés, on cherche ce qui les explique le plus simplement.',\n        'Prenez un phénomène du quotidien (le riz qui colle, le linge qui sèche) : proposez deux explications et dites laquelle demande le moins d’hypothèses.',\n        [['antony', 'cause'], ['fanazavana', 'explication']]),\n      tr('Comprendre', 'Vidéo TED-Ed', 'Comment se répandent les fausses nouvelles', 'Ahoana no ielezan’ny vaovao diso', 'TED-Ed, titre d’origine : « How false news can spread »',\n        'Comment une information fausse se répand-elle, et pourquoi la croit-on ?', 'Distinguer un fait d’une opinion.',\n        'Une courte leçon animée sur la manière dont une fausse nouvelle circule. Elle donne des questions simples à se poser avant de croire ou de partager.',\n        'Prépare à repérer un argument faible.',\n        'Pensez à une nouvelle reçue cette semaine : qui l’a écrite, d’où tenait-il l’information, comment la vérifier ?',\n        [['zava-nisy', 'fait, ce qui s’est passé'], ['hevitra', 'opinion, idée'], ['tsaho', 'rumeur']]),\n      tr('Raisonner', 'Vidéo TED', 'Les meilleures statistiques que vous ayez vues', 'Ireo statistika tsara indrindra hitanao', 'Hans Rosling, Europe, TED 2006, titre d’origine : « The best stats you’ve ever seen »',\n        'Que montrent vraiment les chiffres du monde, et que cachent les moyennes ?', 'Raisonner avec des chiffres simples.',\n        'Hans Rosling y présente l’évolution de la santé et du revenu dans les pays du monde à l’aide de données animées, pour défaire des idées reçues.',\n        'Donne le goût des chiffres avant d’apprendre à les manier : proportions, tendances, comparaisons.',\n        'Dans votre commune, choisissez deux chiffres (prix du riz, nombre d’élèves) et dites ce qu’ils ne montrent pas.',\n        [['salan’isa', 'moyenne'], ['isan-jato', 'pourcentage']]),\n      tr('Raisonner', 'Extrait de texte', 'Réfutations sophistiques', 'Famaliana amin’ny fanamafisam-peo diso', 'Aristote, Europe',\n        'Comment reconnaître un raisonnement qui a l’air solide mais ne l’est pas ?', 'Repérer un argument faible.',\n        'Aristote y dresse l’une des premières listes d’arguments trompeurs : jeux sur le sens des mots, conclusions qui ne découlent pas de ce qui précède.',\n        'S’appuie sur la lecture précise et sur la distinction entre fait et opinion.',\n        'Cherchez dans une publicité un argument qui paraît solide, puis dites ce qui ne tient pas.',\n        [['porofo', 'preuve'], ['diso', 'faux, erroné']],\n        { dial: 'Un discours traditionnel construit souvent ses arguments par images et par formules, la logique d’Aristote les teste par leur forme. Deux outils pour une même question : qu’est-ce qui rend un argument fort ?' }),\n      tr('Construire', 'Extrait de texte', 'Carnets', 'Ny kahie nosoratan’i Leonardo da Vinci', 'Léonard de Vinci, Europe',\n        'Comment passer d’une idée dessinée à quelque chose qui existe ?', 'Passer d’une idée à un projet.',\n        'Les carnets mêlent observations, dessins de machines et notes de fabrication. Ils montrent une habitude : dessiner l’idée, la critiquer, la redessiner.',\n        'Première étape de la construction : rendre l’idée visible pour pouvoir la discuter.',\n        'Dessinez un objet qui n’existe pas encore autour de vous et notez trois problèmes à résoudre pour le fabriquer.',\n        [['tetikasa', 'projet'], ['modely', 'modèle, prototype'], ['sary', 'dessin, image']]),\n      tr('Construire', 'Vidéo TED', 'Comment j’ai mis le vent au travail', 'Ny fomba nampiasako ny rivotra', 'William Kamkwamba, Afrique, TEDGlobal 2009, titre d’origine : « How I harnessed the wind »',\n        'Peut-on construire ce dont on a besoin avec ce qu’on a ?', 'Passer d’une idée à un projet.',\n        'William Kamkwamba raconte comment, adolescent au Malawi, il a construit une éolienne avec des matériaux de récupération pour fournir de l’électricité à sa famille.',\n        'Montre le passage de l’idée à l’objet, avec des moyens limités.',\n        'Listez trois objets jetés autour de vous et ce qu’ils pourraient devenir.',\n        [['herinaratra', 'électricité'], ['rivotra', 'vent'], ['mpamorona', 'créateur, inventeur']]),\n      tr('Impacter', 'Discours historique', 'Discours du prix Nobel de la paix (2004)', 'Lahateny nentin’i Wangari Maathai tamin’ny Nobel', 'Wangari Maathai, Afrique',\n        'Comment une action locale peut-elle changer une communauté, et comment le mesurer ?', 'Mesurer comment ce qu’on fait touche d’autres personnes.',\n        'Dans son discours, Wangari Maathai relie plantation d’arbres, droits et paix. Elle décrit le mouvement de la Ceinture verte, né au Kenya d’actions simples menées par des femmes.',\n        'Dernière étape : regarder l’effet de ce qu’on construit sur les autres.',\n        'Pensez à une action simple de votre quartier : qui en profite, qui ne le sait pas, comment le savoir ?',\n        [['tontolo iainana', 'environnement'], ['fiaraha-monina', 'société, vivre ensemble'], ['fiantraikany', 'effet, impact']],\n        { dial: 'Une image d’arbre pour une action d’arbres : la croissance par petites actions répétées rejoint celle de ce site.' }),\n\n      /* ---------------- Droit ---------------- */\n      idee('A', 'Une règle devient contraignante', 'Rahoviana no tsy maintsy arahina ny lalàna?', 'Pourquoi respecte-t-on une règle ?',\n        'Une règle tient quand le non-respect a une conséquence connue : sanction, perte de confiance, exclusion du groupe.',\n        'Qui sanctionne (l’État, le groupe, la famille) et comment (amende, réparation, réconciliation) change selon les lieux et les époques.',\n        'Une amende de circulation ; une convention villageoise qui fixe des règles pour la pêche ou la forêt, appliquée par la communauté ; un règlement de classe.',\n        'Notez une règle que vous suivez sans que personne ne vous y oblige, et dites pourquoi.',\n        [['lalàna', 'loi, règle'], ['sazy', 'sanction'], ['dina', 'convention communautaire']]),\n      idee('A', 'Le contrat : engagement, contrepartie, moyen de le faire respecter', 'Ny fifanarahana', 'Qu’est-ce qui fait qu’un accord engage vraiment ?',\n        'Deux parties s’engagent, chacune reçoit quelque chose en échange, et il existe un moyen de faire respecter l’accord. On retrouve ces trois éléments dans un bail, un prêt ou un accord de pêche.',\n        'Une parole donnée devant témoins, un écrit signé ou un acte officiel n’ont pas la même force selon les lieux.',\n        'Louer une chambre ; acheter à crédit chez un commerçant ; convenir d’une part de récolte avec un propriétaire.',\n        'Choisissez un accord de votre vie (loyer, prêt entre amis) et écrivez-y les trois éléments.',\n        [['fifanarahana', 'accord, contrat'], ['adidy', 'obligation']],\n        { fig: 'contrat', figCap: 'Les trois éléments d’un contrat.' }),\n      idee('A', 'Écrire pour prouver', 'Manoratra mba hanaporofo', 'Comment prouver ce qu’on affirme ?',\n        'Qui affirme un droit doit pouvoir le montrer : un écrit, un témoin, une trace. Sans preuve, un droit est difficile à faire reconnaître.',\n        'Les preuves admises (écrit, témoins, aveu) varient selon les systèmes.',\n        'Un reçu de paiement ; un certificat foncier pour une terre ; le témoignage d’anciens du village.',\n        'Que garderiez-vous pour prouver que vous avez payé une dette ?',\n        [['porofo', 'preuve'], ['taratasy', 'document, papier'], ['vavolombelona', 'témoin']]),\n      idee('A', 'La propriété : usage, profit, exclusion', 'Ny fananana', 'Que veut dire posséder une chose ?',\n        'Posséder, c’est pouvoir utiliser une chose, en tirer un profit et empêcher d’autres de la prendre. Ces pouvoirs peuvent être séparés ou partagés.',\n        'Terres, forêts, eaux : propriété privée, collective ou publique selon les sociétés.',\n        'Une chambre louée (usage sans propriété) ; une terre familiale transmise ; à Madagascar, des guichets fonciers communaux délivrent des certificats fonciers.',\n        'Dressez la liste de ce que vous utilisez sans le posséder.',\n        [['fananana', 'possession, propriété'], ['tompony', 'propriétaire'], ['tany', 'terre']]),\n      ext('A', 'Extrait de texte', 'Déclaration universelle des droits de l’homme (1948)', 'Fanambarana iraisam-pirenena momba ny zon’olombelona', 'Nations unies, texte collectif',\n        'Quels droits possède-t-on du seul fait d’être une personne ?',\n        'Adoptée en 1948 par l’Assemblée générale des Nations unies, la Déclaration énonce des droits communs à tous les êtres humains. L’extrait montre comment un principe général se formule en articles courts.',\n        'La différence entre un texte de principes et une loi qu’on peut faire appliquer devant un tribunal.',\n        'Choisissez un article et reformulez-le avec vos mots, en donnant un exemple concret.',\n        [['zo', 'droit'], ['zon’olombelona', 'droits humains']]),\n\n      /* ---------------- Politique ---------------- */\n      idee('B', 'Décider à plusieurs', 'Ny fanapahan-kevitra iarahana', 'Comment un groupe décide-t-il malgré ses désaccords ?',\n        'Il faut une règle pour trancher : consensus, majorité, tirage au sort, décision d’un chef ou d’un conseil. Chaque règle protège quelque chose et en sacrifie une autre.',\n        'Le choix de la règle dépend de la taille du groupe et de l’enjeu.',\n        'Une famille réunie pour une décision importante ; une assemblée villageoise où l’on cherche souvent l’accord par la parole ; un vote à la majorité dans une association.',\n        'Pensez à un désaccord récent dans votre entourage : comment a-t-il été tranché, et par quelle règle ?',\n        [['fanapahan-kevitra', 'décision'], ['fifidianana', 'élection, vote'], ['fokonolona', 'communauté villageoise']]),\n      idee('B', 'Pouvoir et légitimité', 'Ny fahefana sy ny fankatoavana', 'Pourquoi obéit-on ?',\n        'Un pouvoir tient quand ceux qui lui obéissent le reconnaissent comme juste. Max Weber distingue la tradition, le charisme d’une personne et la règle légale.',\n        'Les sources de légitimité se mêlent différemment selon les pays et les époques.',\n        'Un ancien respecté ; un dirigeant populaire ; un fonctionnaire dont l’autorité vient de la loi.',\n        'Pensez à une personne à qui vous obéissez volontiers : pour laquelle des trois raisons ?',\n        [['fahefana', 'pouvoir, autorité'], ['fitondrana', 'gouvernement'], ['ara-dalàna', 'légal']]),\n      idee('B', 'Limiter le pouvoir', 'Ny fameperana ny fahefana', 'Comment éviter qu’un pouvoir abuse ?',\n        'Un pouvoir sans limite peut abuser. On le limite en le partageant, en le contrôlant, en le renouvelant à intervalles réguliers.',\n        'La séparation des pouvoirs est plus ou moins stricte, la durée des mandats varie.',\n        'Montesquieu a formulé l’idée de séparation des pouvoirs au XVIIIe siècle ; dans une association, un trésorier peut être contrôlé par deux autres membres.',\n        'Dans une association que vous connaissez, qui contrôle qui ?',\n        [['fitsarana', 'justice'], ['mpanao lalàna', 'législateur']],\n        { fig: 'sep', figCap: 'Trois pouvoirs qui se contrôlent mutuellement.' }),\n      idee('B', 'Les grands courants d’idées', 'Ireo hevitra politika lehibe', 'Comment comprendre les courants sans prendre parti ?',\n        'Chaque courant répond à une question : jusqu’où va la liberté individuelle ? Quelle place pour l’égalité, la tradition, la communauté ? Les comprendre, c’est pouvoir en discuter.',\n        'Les mêmes mots recouvrent des réalités différentes d’un pays à l’autre.',\n        'Libéralisme, socialisme, conservatisme, écologisme, nationalisme : chacun a ses arguments, ses limites et ses critiques.',\n        'Pour un courant qui n’est pas le vôtre, écrivez l’argument le plus fort que ses partisans pourraient donner.',\n        [['fahalalahana', 'liberté'], ['fitoviana', 'égalité']]),\n      ext('B', 'Extrait de texte', 'Muqaddima', 'Ny Muqaddima', 'Ibn Khaldoun, Afrique',\n        'Comment naissent, tiennent et déclinent les sociétés ?',\n        'Dans l’introduction de son histoire universelle, Ibn Khaldoun cherche des causes générales à la montée et au déclin des pouvoirs, au lieu de seulement raconter des événements. Il parle de la solidarité d’un groupe, l’asabiyya.',\n        'Qu’on peut étudier une société avec des causes, et pas seulement des récits.',\n        'Choisissez un groupe que vous connaissez : qu’est-ce qui le tient uni, et qu’est-ce qui pourrait l’affaiblir ?',\n        [['fiaraha-monina', 'société'], ['firaisankina', 'solidarité, union']]),\n\n      /* ---------------- Économie et finance ---------------- */\n      idee('C', 'Rareté et choix', 'Ny tsy fahampiana sy ny safidy', 'Pourquoi faut-il toujours choisir ?',\n        'Les ressources (argent, temps, terre) sont limitées. Choisir une chose, c’est renoncer à une autre : c’est ce qu’on appelle le coût d’opportunité.',\n        'Ce qui est rare dépend du lieu et de la saison.',\n        'Un champ planté en riz ne l’est pas en manioc ; une heure de transport n’est pas une heure de travail.',\n        'Pour votre prochaine dépense, notez ce à quoi vous renoncez.',\n        [['safidy', 'choix'], ['vola', 'argent'], ['fatiantoka', 'renoncement, sacrifice']]),\n      idee('C', 'Le prix, rencontre de l’offre et de la demande', 'Ny vidiny: fihaonan’ny tolotra sy ny fangatahana', 'Pourquoi un prix monte ou baisse-t-il ?',\n        'Quand un bien devient plus rare ou plus demandé, son prix tend à monter ; quand il abonde, il tend à baisser.',\n        'Les États, les intermédiaires et les saisons agissent sur les prix.',\n        'Le prix du riz avant et après la récolte ; le prix d’un produit d’exportation qui dépend du marché mondial, comme la vanille, que Madagascar produit en grande quantité.',\n        'Relevez le prix d’un même produit sur deux marchés ou à deux saisons, et proposez une explication.',\n        [['vidiny', 'prix'], ['tsena', 'marché'], ['tolotra', 'offre'], ['fangatahana', 'demande']],\n        { fig: 'prix', figCap: 'L’offre et la demande se croisent au prix d’équilibre.' }),\n      idee('C', 'L’argent dans le temps : l’intérêt', 'Ny vola amin’ny fotoana: ny zanabola', 'Pourquoi un prêt coûte-t-il plus que la somme empruntée ?',\n        'Recevoir de l’argent maintenant n’équivaut pas à le recevoir plus tard. L’intérêt est le prix du temps et du risque.',\n        'Les taux varient selon les prêteurs, les pays et les époques.',\n        'Avec un intérêt de 5 % par mois, une dette de 100 000 Ar devient environ 180 000 Ar au bout d’un an si rien n’est remboursé. Exemple chiffré fictif.',\n        'Calculez ce que devient 10 000 Ar à 3 % par mois au bout de trois mois.',\n        [['zanabola', 'intérêt'], ['trosa', 'dette'], ['tahiry', 'épargne']],\n        { fig: 'interet', figCap: 'Intérêt composé et intérêt simple pour 100 000 Ar à 5 % par mois.' }),\n      idee('C', 'Partager les risques', 'Ny fizarana ny loza', 'Que faire quand survient une mauvaise année ?',\n        'Les mauvaises années arrivent. On se protège en mettant de côté ou en mutualisant : beaucoup donnent un peu pour que quelques-uns reçoivent beaucoup quand le malheur frappe.',\n        'La mutualisation peut être informelle (famille, voisins), organisée (coopératives) ou formelle (assurances).',\n        'Des groupes d’épargne entre voisins ; la solidarité familiale lors d’un deuil ou d’une maladie ; l’assurance d’un véhicule.',\n        'Qui vous aiderait si vos revenus s’arrêtaient un mois, et dans quelle organisation ?',\n        [['tahiry', 'épargne'], ['fiaraha-miasa', 'coopération']]),\n      ext('C', 'Extrait de texte', 'Le livre abrégé du calcul par la restauration et la comparaison', 'Boky fohy momba ny kajy', 'Al-Khwarizmi, Asie',\n        'Comment résoudre des problèmes pratiques avec une méthode générale ?',\n        'Ce traité, écrit à Bagdad au IXe siècle, donne des méthodes pour résoudre des équations et les applique à des partages d’héritage, au commerce et à la mesure des terres. Le mot « algèbre » vient de son titre.',\n        'Qu’une méthode générale peut servir à des situations très différentes : partager, vendre, mesurer.',\n        'Écrivez en trois lignes un problème de partage de votre vie et la méthode que vous suivriez pour le résoudre.',\n        [['kajy', 'calcul'], ['fampitahana', 'comparaison']]),\n\n      /* ---------------- Entrepreneuriat ---------------- */\n      idee('D', 'Partir d’un problème réel', 'Manomboka amin’ny olana tena misy', 'Quel problème de quelqu’un vaut la peine d’être résolu ?',\n        'Une activité tient quand elle répond à un besoin que des personnes ont vraiment, et pour lequel elles sont prêtes à donner du temps ou de l’argent.',\n        'Les besoins dépendent du lieu : eau, énergie, transport, conservation des récoltes.',\n        'Conserver des fruits après la récolte ; recharger des téléphones dans un village sans électricité.',\n        'Observez un problème autour de vous et décrivez-le en trois phrases, sans proposer de solution.',\n        [['olana', 'problème'], ['filàna', 'besoin'], ['vahaolana', 'solution']]),\n      idee('D', 'Tester petit avant de grandir', 'Mitsapa kely vao manitatra', 'Comment limiter le prix d’une erreur ?',\n        'Avant d’investir beaucoup, on teste une version simple avec quelques personnes. Une erreur à petite échelle coûte peu et apprend beaucoup.',\n        'Ce qu’on peut tester dépend du budget et des habitudes locales.',\n        'Vendre dix portions d’un plat avant d’ouvrir un étal ; faire un prototype en carton avant de commander des pièces.',\n        'Imaginez un prototype avec trois matériaux de récupération et dessinez-le.',\n        [['andrana', 'essai'], ['modely', 'prototype']]),\n      idee('D', 'Coûts, prix, marge', 'Ny fandaniana, ny vidiny ary ny tombony', 'À quelle condition une activité dure-t-elle ?',\n        'Une activité dure si ce qu’elle rapporte dépasse ce qu’elle coûte, en comptant son propre temps.',\n        'Les coûts changent (transport, taxes, matières premières) selon le lieu.',\n        'Un article coûte 600 Ar à produire et se vend 1 000 Ar : la marge est de 400 Ar, avant de compter le transport et le temps de travail. Exemple fictif.',\n        'Calculez le coût réel d’un petit produit que vous connaissez.',\n        [['tombontsoa', 'bénéfice'], ['fandaniana', 'dépense'], ['vidiny', 'prix']],\n        { fig: 'marge', figCap: 'De quoi se compose un prix de vente.' }),\n      idee('D', 'Compter sur les autres', 'Miantehitra amin’ny hafa', 'Avec qui une activité se construit-elle ?',\n        'Aucune activité ne tient seule : clients, fournisseurs, voisins, famille. La confiance se construit par des échanges tenus.',\n        'Les réseaux de confiance passent par la famille, la communauté ou des règles écrites.',\n        'Un commerçant qui accorde un crédit à un client connu ; un groupe de producteurs qui vend ensemble.',\n        'Qui serait votre premier client, et pourquoi vous ferait-il confiance ?',\n        [['mpanjifa', 'client'], ['mpamatsy', 'fournisseur'], ['fahatokisana', 'confiance']]),\n      ext('D', 'Discours historique', 'Conférence du prix Nobel de la paix (2006)', 'Lahateny nentin’i Muhammad Yunus tamin’ny Nobel', 'Muhammad Yunus, Asie',\n        'Un problème de pauvreté peut-il devenir un projet qui dure ?',\n        'En 2006, Muhammad Yunus et la Grameen Bank reçoivent le prix Nobel de la paix. Son discours présente le microcrédit : de petits prêts, surtout à des femmes, pour lancer de petites activités.',\n        'Comment un problème social peut devenir un projet qui se finance lui-même, et quelles questions de confiance cela pose.',\n        'Choisissez un petit besoin de votre quartier et imaginez comment le financer sans don.',\n        [['mpandraharaha', 'entrepreneur'], ['orinasa', 'entreprise']],\n        { dial: 'Rapprochez ce discours des groupes d’épargne de village : mêmes questions de confiance et de remboursement, réponses différentes.' }),\n\n      /* ---------------- Information et numérique ---------------- */\n      idee('E', 'D’où vient ce que je crois savoir ?', 'Avy aiza ny zavatra inoako fa fantatro?', 'Comment se forme ce qu’on croit savoir ?',\n        'Nous croyons surtout ce que disent des personnes ou des médias en qui nous avons confiance, rarement après avoir vérifié nous-mêmes. Savoir d’où vient une information est le premier réflexe.',\n        'Les sources de confiance (famille, radio, réseaux, école) varient selon les milieux.',\n        'Une rumeur transmise par un proche ; une information entendue à la radio ; une publication partagée sur un réseau social.',\n        'Prenez une chose que vous croyez savoir et retrouvez de qui ou d’où vous la tenez.',\n        [['loharano', 'source'], ['vaovao', 'information, nouvelle'], ['tsaho', 'rumeur']]),\n      idee('E', 'Ce que l’algorithme vous montre', 'Izay asehon’ny algorithme anao', 'Pourquoi deux personnes ne voient-elles pas la même chose ?',\n        'Les plateformes choisissent ce qu’elles affichent, d’après ce qui retient l’attention. Deux personnes ne voient pas le même fil.',\n        'Les règles et la transparence dépendent des plateformes et des pays.',\n        'Deux voisins qui cherchent la même chose et obtiennent des résultats différents ; une vidéo recommandée parce que d’autres l’ont regardée.',\n        'Comparez, avec un proche, les cinq premières publications de votre fil.',\n        [['aterineto', 'internet'], ['angona', 'donnée']]),\n      idee('E', 'Vos traces numériques', 'Ny dian’ny nomerika nataonao', 'Que savent de vous les outils que vous utilisez ?',\n        'Chaque usage laisse des traces : recherches, localisation, achats. Elles ont de la valeur pour ceux qui les collectent.',\n        'La protection légale des données personnelles est très variable.',\n        'Une application qui demande l’accès à vos contacts ; un paiement par mobile qui enregistre vos achats, par exemple avec Mvola, Orange Money ou Airtel Money.',\n        'Listez les applications de votre téléphone et ce à quoi chacune a accès.',\n        [['tsiambaratelo', 'confidentialité, secret'], ['fiarovana', 'protection'], ['nomerika', 'numérique']]),\n      idee('E', 'Copier ne coûte presque rien', 'Ny fanaovana kopia dia saika tsy lany vola', 'Que devient le droit de celui qui crée ?',\n        'Une fois créé, un fichier se copie sans effort et à coût presque nul. Cela facilite le partage et pose la question des droits de ceux qui l’ont créé.',\n        'La durée et les exceptions du droit d’auteur varient. Les textes anciens tombent dans le domaine public.',\n        'Une chanson copiée d’un téléphone à l’autre ; une photo reprise sans mention de son auteur ; un texte ancien, libre de droits.',\n        'Pour un contenu que vous avez partagé, retrouvez qui l’a créé.',\n        [['mpamorona', 'créateur'], ['kopia', 'copie']]),\n      ext('E', 'Vidéo', 'Une nanoseconde en fil', 'Ny nanosegondra, nasehon’i Grace Hopper', 'Grace Hopper, Amérique, extrait de conférence',\n        'Comment rendre visible une durée que personne ne peut percevoir ?',\n        'Grace Hopper, pionnière de l’informatique, montrait une longueur de fil d’environ 30 centimètres pour illustrer la distance parcourue par la lumière en une nanoseconde.',\n        'Pourquoi la vitesse des ordinateurs a des limites physiques, et comment un objet simple aide à comprendre une idée abstraite.',\n        'Trouvez un objet de la maison qui pourrait représenter une durée ou une distance qu’on ne peut pas voir.',\n        [['fotoana', 'temps'], ['milina', 'machine']]),\n\n      /* ---------------- Sociologie des organisations ---------------- */\n      idee('F', 'Pourquoi s’organise-t-on à plusieurs ?', '', 'Qu’est-ce qu’une organisation permet que l’on ne peut pas faire seul ?',\n        'Une organisation permet de faire à plusieurs ce qu’on ne peut pas faire seul, en répartissant les tâches et en coordonnant les efforts autour d’un but commun.',\n        'Les formes varient : famille, association, coopérative, entreprise, administration. Elles diffèrent par leur taille, leurs règles et leur but.',\n        'Une coopérative de producteurs ; un comité qui gère un marché de quartier ; un hôpital, où des dizaines de métiers travaillent ensemble.',\n        'Citez une organisation dont vous faites partie et dites ce qu’elle permet de faire que vous ne feriez pas seul.', [], {}),\n      idee('F', 'Diviser le travail et coordonner', '', 'Comment répartit-on les tâches sans que chacun perde de vue le tout ?',\n        'Diviser le travail augmente ce qu’on produit, parce que chacun se spécialise. Mais il faut coordonner : règles, hiérarchie, réunions, ajustements.',\n        'Le degré de division et de formalisme varie selon la taille et le domaine.',\n        'Adam Smith décrivait en 1776 une manufacture d’épingles où la fabrication est répartie en une vingtaine d’opérations. Dans un petit atelier, chacun fait plusieurs gestes.',\n        'Dessinez les étapes d’un travail d’équipe que vous connaissez et indiquez qui coordonne.', [], {}),\n      idee('F', 'La bureaucratie : règles, compétences, dossiers', '', 'Pourquoi les administrations fonctionnent-elles par règles et par dossiers ?',\n        'Max Weber décrit la bureaucratie comme un mode d’organisation à règles écrites, compétences définies, hiérarchie et dossiers. Il traite les cas de manière égale et prévisible, au prix de lenteur et de rigidité.',\n        'Le niveau de formalisme et la place laissée à l’initiative varient selon les administrations.',\n        'Obtenir un document officiel suppose un dossier, des pièces, un guichet et un délai. Chaque étape protège contre l’arbitraire, mais peut ralentir.',\n        'Décrivez une démarche administrative récente et dites ce que la règle protégeait.', [], {}),\n      idee('F', 'Diriger une équipe', '', 'Que fait quelqu’un qui dirige un groupe ?',\n        'Diriger, c’est fixer un cap, répartir les tâches, suivre l’avancement, écouter, trancher. Ces fonctions se partagent parfois entre plusieurs personnes.',\n        'Les styles vont du très directif au très participatif, selon la culture, la taille et l’urgence.',\n        'Un chef de chantier, une directrice d’école, une présidente d’association : mêmes fonctions, manières différentes.',\n        'Pensez à une personne dont vous avez apprécié la manière de diriger et notez ce qu’elle faisait.', [], {}),\n      ext('F', 'Extrait de texte', 'Administration industrielle et générale', '', 'Henri Fayol, Europe',\n        'Quelles fonctions retrouve-t-on dans toute organisation ?',\n        'Henri Fayol, ingénieur et dirigeant d’entreprise, y décrit des fonctions de l’administration : prévoir, organiser, commander, coordonner, contrôler.',\n        'Un vocabulaire de base du management, utile aussi pour une association ou un projet familial.',\n        'Appliquez les cinq fonctions à un projet que vous avez mené : laquelle avez-vous le moins travaillée ?', [], {}),\n\n      /* ---------------- Arts et monde créatif ---------------- */\n      idee('G', 'Créer, c’est choisir', '', 'Qu’est-ce qui fait qu’une œuvre existe ?',\n        'Une œuvre naît de choix : la matière, la forme, ce qu’on garde et ce qu’on laisse de côté.',\n        'Les critères du beau et du réussi varient selon les époques et les lieux.',\n        'Un tissage, une chanson, une photographie : à chaque fois, des choix de matière, de rythme, de cadrage.',\n        'Choisissez une œuvre que vous aimez et notez trois choix que son auteur a faits.', [], {}),\n      idee('G', 'Forme et contenu : dire et comment le dire', '', 'Comment la forme change-t-elle ce que l’on dit ?',\n        'La même idée, dite en chanson, en dessin ou en discours, ne produit pas le même effet. La forme fait partie du message.',\n        'Chaque tradition a ses formes préférées et ses codes.',\n        'Raconter une histoire en conte, en bande dessinée ou en chanson : chaque forme met l’accent sur autre chose.',\n        'Exprimez une même idée en deux formes différentes, par exemple en trois lignes puis en un dessin.', [], {}),\n      idee('G', 'Le public : pour qui crée-t-on ?', '', 'Une création existe-t-elle sans quelqu’un pour la recevoir ?',\n        'Une œuvre prend aussi son sens dans ce qu’elle suscite chez les autres. On crée parfois pour soi, parfois pour un public précis.',\n        'Les lieux de rencontre avec le public (marché, fête, scène, écran) changent la manière de créer.',\n        'Un groupe qui chante pour une fête de village ; une illustratrice qui publie en ligne ; un menuisier qui expose dans une foire.',\n        'Imaginez la première personne à qui vous montreriez votre création et ce que vous attendriez d’elle.', [], {}),\n      idee('G', 'Vivre de sa création', '', 'Comment une création devient-elle un métier ?',\n        'Faire d’une création un métier suppose un public, un lieu où la montrer, un prix, et la reconnaissance de ses droits.',\n        'Les modèles varient : commande, vente directe, abonnement, mécénat, enseignement.',\n        'Un artisan qui vend sur un marché ; une musicienne qui joue pour des cérémonies ; un photographe qui travaille pour des entreprises.',\n        'Listez trois manières dont une personne de votre entourage pourrait vivre de ce qu’elle sait créer.', [], {}),\n      ext('G', 'Vidéo TED', 'Les écoles tuent-elles la créativité ?', '', 'Ken Robinson, Europe, TED 2006, titre d’origine : « Do schools kill creativity? »',\n        'La créativité mérite-t-elle autant de place que le reste des savoirs ?',\n        'Ken Robinson y défend l’idée que la créativité mérite autant d’attention que l’écriture ou les mathématiques dans l’éducation.',\n        'Un exemple de la manière dont un orateur mêle humour, récit et argument pour défendre une idée.',\n        'Notez deux situations où l’on vous a encouragé, ou découragé, à essayer quelque chose de nouveau.', [], {})\n    ];\n    return this._c;\n  }\n\n  /* ---------- racines : radicelles ---------- */\n  rootsData() {\n    if (this._r) return this._r;\n    const it = (id, title, sum, q, about, offers, amorce) => ({\n      id: id, title: title, sum: sum, q: q,\n      secs: [['De quoi s’agit-il', about], ['À explorer', offers]],\n      amorce: amorce\n    });\n    this._r = [\n      { k: 'rHi', name: 'Histoire', desc: 'Comment l’île s’est peuplée, a été gouvernée, a traversé la colonisation puis l’indépendance. Repères et récits pour se situer.', items: [\n        it('hi1', 'Le peuplement de l’île', 'Des vagues successives venues d’Asie du Sud-Est et d’Afrique de l’Est.', 'D’où viennent les gens et les pratiques que je connais ?',\n          'L’île a été peuplée par vagues successives, venues d’Asie du Sud-Est et d’Afrique de l’Est. Leurs apports se retrouvent dans la langue, les pratiques et les paysages.',\n          'Des récits de navigation et des pistes issues de la linguistique et de la génétique, présentés comme des éléments qui se croisent plutôt que comme une vérité fermée.',\n          'Demandez à un aîné l’origine d’un mot, d’un plat ou d’une pratique de votre région.'),\n        it('hi2', 'Les royaumes et leurs souverains', 'Des manières de gouverner, de commercer et de transmettre la mémoire avant la colonisation.', 'Comment gouvernait-on avant l’État moderne ?',\n          'Avant la colonisation, plusieurs royaumes ont existé dans l’île, chacun avec ses manières de gouverner, de commercer et de transmettre la mémoire.',\n          'Quelques portraits de royaumes et de souverains, des cartes et des extraits de récits mis en regard.',\n          'Dessinez une frise de trois siècles de votre région à partir de ce que vous savez.'),\n        it('hi3', 'La période coloniale', 'Une transformation de l’administration, de l’économie et de l’école, et des résistances.', 'Que reste-t-il de cette période dans la vie quotidienne ?',\n          'En 1896, l’île devient une colonie française. Cette période a transformé l’administration, l’économie et l’école, et elle a suscité des résistances.',\n          'Des documents d’époque et des témoignages lus avec précaution, en distinguant les faits, les interprétations et les mémoires.',\n          'Cherchez autour de vous un objet, un nom de rue ou une règle qui date de cette période.'),\n        it('hi4', 'L’indépendance et ses suites', 'Des repères sobres sur une jeune nation qui se construit.', 'Comment une jeune nation se construit-elle ?',\n          'L’indépendance est proclamée en 1960. Depuis, le pays a connu plusieurs périodes politiques et économiques différentes.',\n          'Des repères sobres, sans prise de position partisane, appuyés sur plusieurs sources.',\n          'Notez trois événements qui ont changé la vie de votre famille depuis 1960, et ce qu’ils ont changé.')\n      ] },\n      { k: 'rCo', name: 'Cosmovision', desc: 'La manière de comprendre le monde et les liens entre les vivants, les ancêtres et le divin. Des notions pour se faire une vue d’ensemble, présentées avec respect, sans les réduire ni les juger.', items: [\n        it('co1', 'Andriamanitra, Zanahary, Razana', 'Trois termes pour parler du divin, du créateur et des ancêtres.', 'Comment parle-t-on de ce qui nous dépasse ?',\n          'On rencontre trois termes pour parler du divin, du créateur et des ancêtres. Leurs sens et leurs relations varient selon les régions et les croyances.',\n          'Une présentation de ces termes, de leurs usages dans la parole et les rites, et de leur rencontre avec d’autres religions.',\n          'Notez les contextes où vous avez entendu l’un de ces mots.'),\n        it('co2', 'Tsiny sy Tody', 'Une manière de penser la responsabilité et le retour des actes.', 'Les actes reviennent-ils sur ceux qui les commettent ?',\n          'Le tsiny désigne le reproche ou la faute, le tody le retour de ce qui a été fait, en bien ou en mal. Ensemble, ils expriment une manière de penser la responsabilité.',\n          'Des situations concrètes où ces notions sont invoquées, mises en regard d’autres idées de la responsabilité.',\n          'Racontez une situation où une action a eu un effet de retour, sans juger personne.'),\n        it('co3', 'Hasina', 'Une force ou une valeur qui appelle le respect.', 'Qu’est-ce qui mérite le respect, et pourquoi ?',\n          'Le hasina désigne une force ou une valeur sacrée que possèdent certaines personnes, certains lieux ou certains objets, et qui appelle le respect.',\n          'Des exemples de personnes, de lieux et de gestes associés au respect, pour comprendre comment une valeur s’exprime.',\n          'Décrivez un geste de respect que vous faites sans y penser.'),\n        it('co4', 'Fanahy', 'L’esprit, le caractère, la pensée.', 'Qu’est-ce qui fait le caractère d’une personne ?',\n          'Ce mot recouvre à la fois l’esprit, le caractère et la pensée. On parle par exemple de la manière d’être d’une personne.',\n          'Des usages du mot dans la parole de tous les jours, pour comprendre comment une langue découpe l’intériorité.',\n          'Écrivez trois mots pour décrire le caractère de quelqu’un que vous admirez.'),\n        it('co5', 'Fihavanana', 'Le lien entre proches et l’harmonie qu’il demande.', 'Qu’est-ce qu’on se doit entre proches ?',\n          'Le fihavanana désigne le lien de parenté, réelle ou choisie, et l’harmonie qui doit exister entre ceux qui le partagent : entraide, respect, concorde.',\n          'Des situations de la vie courante où ce lien joue, avec ses avantages et ses tensions.',\n          'Pensez à une aide reçue ou donnée récemment : qu’est-ce qui l’a rendue naturelle ?')\n      ] },\n      { k: 'rLi', name: 'Littérature', desc: 'Les formes de la parole et du chant : discours, proverbes, poèmes, chants. Une écoute de la variété de ces formes.', items: [\n        it('li1', 'Kabary', 'L’art du discours formel.', 'Qu’est-ce qui fait qu’un discours est bien dit ?',\n          'Le kabary est l’art du discours formel, prononcé lors de cérémonies, de rencontres entre familles ou de réunions, souvent riche en images et en formules codifiées.',\n          'Quelques discours à écouter ou à lire, avec une explication de leur structure.',\n          'Écrivez trois phrases d’ouverture pour accueillir quelqu’un, en cherchant des images.'),\n        it('li2', 'Ohabolana', 'Des proverbes qui condensent une expérience collective.', 'Quelle expérience un proverbe résume-t-il ?',\n          'Les ohabolana sont des proverbes qui condensent une expérience collective, souvent sous forme d’image. On les cite pour conseiller, nuancer ou clore une discussion.',\n          'Une petite sélection commentée, classée par situation de la vie.',\n          'Choisissez un proverbe que vous connaissez et racontez une situation où il s’applique.'),\n        it('li3', 'Hainteny', 'Une poésie allusive, souvent en échange.', 'Que dit-on quand on dit les choses à demi-mot ?',\n          'Le hainteny est une poésie traditionnelle, allusive et imagée, souvent construite comme un échange. Elle dit beaucoup en peu de mots.',\n          'Quelques extraits lus lentement, avec des pistes pour percevoir ce qu’ils suggèrent.',\n          'Écrivez quatre lignes qui parlent d’un sentiment sans jamais le nommer.'),\n        it('li4', 'Sôva', 'Une forme de tradition orale qui joue avec les mots.', 'Comment joue-t-on avec les mots ?',\n          'Le sôva est une forme de la tradition orale qui joue avec les mots.',\n          'Des exemples choisis avec des spécialistes, présentés avec leur contexte.',\n          'Inventez un jeu de mots à poser à quelqu’un de votre entourage.'),\n        it('li5', 'Antsa', 'Des chants pour célébrer, raconter, accompagner.', 'Que fait-on avec un chant que l’on partage ?',\n          'Les antsa sont des chants, souvent collectifs et rythmés, qui servent à célébrer, à raconter ou à accompagner un événement.',\n          'Des enregistrements et des textes, avec le contexte dans lequel ils sont chantés.',\n          'Notez un chant que l’on chante chez vous et à quelle occasion.'),\n        it('li6', 'Beko', 'Des chants à plusieurs voix, transmis oralement.', 'Que change le fait de chanter à plusieurs voix ?',\n          'Le beko désigne des chants à plusieurs voix, transmis oralement et interprétés en groupe.',\n          'Des enregistrements choisis avec des spécialistes, accompagnés d’explications sur leur origine.',\n          'Écoutez un chant à plusieurs voix et décrivez ce que fait chaque voix.')\n      ] },\n      { k: 'rTr', name: 'Traditions', desc: 'Les rites et les cérémonies qui rythment la vie des familles et des communautés. Des repères pour comprendre le sens de ces pratiques, qui varient selon les régions.', items: [\n        it('tr1', 'Joro', 'Une invocation parlée pour demander la bénédiction.', 'Que dit-on quand on demande une bénédiction ?',\n          'Le joro est une invocation parlée, prononcée par un ancien ou par un officiant, pour demander la bénédiction des ancêtres et de Dieu lors d’un événement.',\n          'Des exemples de situations où le joro est prononcé, et de ses formules.',\n          'Écrivez trois phrases que vous diriez pour bénir un projet qui commence.'),\n        it('tr2', 'Fitampoha', 'Le bain des reliques royales.', 'Comment une communauté garde-t-elle la mémoire de ses souverains ?',\n          'Le fitampoha est une cérémonie associée aux Sakalava, au cours de laquelle les reliques royales sont baignées. Elle rassemble la communauté autour de la mémoire de ses souverains.',\n          'Un récit de la cérémonie et de son sens.',\n          'Décrivez une cérémonie de votre région qui rassemble la communauté.'),\n        it('tr3', 'Famadihana', 'La cérémonie du retournement des morts.', 'Que dit une société de la façon dont elle honore ses morts ?',\n          'Le famadihana est une cérémonie, pratiquée surtout dans les Hautes Terres, au cours de laquelle les défunts sont sortis du tombeau pour être enveloppés dans de nouveaux linceuls, en famille.',\n          'Des récits de la cérémonie et de son sens pour les familles, avec leurs différentes interprétations.',\n          'Racontez comment votre famille se retrouve pour honorer ses proches disparus.')\n      ] }\n    ];\n    return this._r;\n  }\n\n  /* ---------- géométrie de l'arbre (calculée une seule fois) ---------- */\n  buildGeo() {\n    if (this._g) return this._g;\n    let seed = 11;\n    const rnd = () => {\n      seed = (seed + 0x6D2B79F5) | 0;\n      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n    const r1 = (v) => Math.round(v * 10) / 10;\n    const rad = Math.PI / 180;\n    const pt = (c, t) => {\n      const u = 1 - t;\n      return {\n        x: u * u * u * c[0] + 3 * u * u * t * c[2] + 3 * u * t * t * c[4] + t * t * t * c[6],\n        y: u * u * u * c[1] + 3 * u * u * t * c[3] + 3 * u * t * t * c[5] + t * t * t * c[7]\n      };\n    };\n    const dv = (c, t) => {\n      const u = 1 - t;\n      return {\n        x: 3 * u * u * (c[2] - c[0]) + 6 * u * t * (c[4] - c[2]) + 3 * t * t * (c[6] - c[4]),\n        y: 3 * u * u * (c[3] - c[1]) + 6 * u * t * (c[5] - c[3]) + 3 * t * t * (c[7] - c[5])\n      };\n    };\n    const D = (c) => 'M' + r1(c[0]) + ' ' + r1(c[1]) + ' C ' + r1(c[2]) + ' ' + r1(c[3]) + ', ' + r1(c[4]) + ' ' + r1(c[5]) + ', ' + r1(c[6]) + ' ' + r1(c[7]);\n    const twig = (c, t, deg, len, bend) => {\n      const p = pt(c, t), v = dv(c, t);\n      const a = Math.atan2(v.y, v.x) + deg * rad;\n      const b = a + bend * rad;\n      const b2 = b + bend * 0.5 * rad;\n      return [\n        p.x, p.y,\n        p.x + Math.cos(a) * len * 0.35, p.y + Math.sin(a) * len * 0.35,\n        p.x + Math.cos(b) * len * 0.7, p.y + Math.sin(b) * len * 0.7,\n        p.x + Math.cos(b2) * len, p.y + Math.sin(b2) * len\n      ];\n    };\n\n    const full = { socle: 'Tronc', A: 'Droit', B: 'Politique', C: 'Économie et finance', D: 'Entrepreneuriat', E: 'Information et numérique', F: 'Sociologie des organisations', G: 'Arts et monde créatif', rHi: 'Histoire', rCo: 'Cosmovision', rLi: 'Littérature', rTr: 'Traditions' };\n    const vis = [], hits = [], pos = [], labels = [], slots = {};\n    const addCurve = (c, k, w, dl, hitW, main) => {\n      vis.push({ d: D(c), w: w, k: k, dl: Math.min(dl, 7) });\n      if (hitW) hits.push({ d: D(c), w: hitW, k: k, main: !!main, label: full[k] });\n    };\n    const leaf = (c, t, side, dom) => {\n      const p = pt(c, t), v = dv(c, t);\n      const deg = Math.atan2(v.y, v.x) / rad;\n      pos.push({\n        x: r1(p.x), y: r1(p.y),\n        rot: r1(deg + 90 + side * 48 + (rnd() - 0.5) * 14),\n        s: Math.round((1 + rnd() * 0.22) * 100) / 100,\n        dom: dom\n      });\n    };\n\n    /* Tronc */\n    const trunkC = [400, 700, 396, 620, 406, 520, 402, 440];\n    vis.push({ d: 'M382 704 C 392 690 390 660 391 620 C 392 560 396 500 394 440 L 411 440 C 410 500 408 560 409 620 C 410 660 408 690 420 704 Z', w: 1.5, k: 'socle', dl: 0, trunk: true });\n    hits.push({ d: D(trunkC), w: 44, k: 'socle', main: true, label: 'Tronc' });\n\n    /* Rameaux du Tronc : les neuf feuilles montent avec les étapes (observer, comprendre, raisonner, construire, impacter) */\n    const tt = [[0.2, -62, 58], [0.33, 62, 58], [0.46, -62, 56], [0.59, 62, 54], [0.72, -58, 52]];\n    tt.forEach((q, n) => {\n      const tw = twig(trunkC, q[0], q[1], q[2], q[1] < 0 ? 12 : -12);\n      addCurve(tw, 'socle', 1.1, 1, 22, false);\n      if (n < 4) leaf(tw, 0.5, q[1] < 0 ? -1 : 1, 'socle');\n      leaf(tw, 1, 0, 'socle');\n    });\n    slots.socle = [[trunkC, 0.265, 22], [trunkC, 0.395, -22], [trunkC, 0.525, 22], [trunkC, 0.655, -22], [trunkC, 0.785, 22]];\n    slots.libre = [[trunkC, 0.06, -26], [trunkC, 0.06, 26], [trunkC, 0.92, -22], [trunkC, 0.92, 22]];\n\n    /* Branches latérales */\n    const names = { A: 'Droit', B: 'Politique', C: 'Économie', D: 'Entrepreneuriat', F: 'Organisations', G: 'Arts' };\n    const domain = (k, m, s, dl) => {\n      const tws = [\n        twig(m, 0.3, s * (40 + rnd() * 10), 105 + rnd() * 20, -s * (15 + rnd() * 8)),\n        twig(m, 0.52, -s * (32 + rnd() * 10), 80 + rnd() * 16, s * (10 + rnd() * 8)),\n        twig(m, 0.76, s * (36 + rnd() * 10), 66 + rnd() * 14, -s * 14)\n      ];\n      const sub = twig(tws[0], 0.62, -s * 40, 50, s * 10);\n      addCurve(m, k, 1.9, dl, 36, true);\n      tws.forEach((c) => addCurve(c, k, 1.2, dl + 1, 26, false));\n      addCurve(sub, k, 0.9, dl + 2, 0, false);\n      leaf(m, 0.64, s, k);\n      leaf(m, 1, 0, k);\n      leaf(tws[0], 1, 0, k);\n      leaf(tws[1], 1, 0, k);\n      leaf(tws[2], 1, 0, k);\n      slots[k] = [[m, 0.42, s * 18], [tws[1], 0.65, -s * 16], [m, 0.84, -s * 18], [tws[0], 0.7, s * 16], [tws[2], 0.5, s * 14]];\n      const p = pt(m, 1), v = dv(m, 1), L = Math.hypot(v.x, v.y) || 1;\n      const ux = v.x / L, uy = v.y / L;\n      labels.push({ k: k, t: names[k], x: r1(p.x + ux * 60), y: r1(p.y + uy * 60), anchor: ux < 0 ? 'end' : 'start' });\n    };\n    domain('A', [398, 480, 355, 450, 300, 430, 235, 345], 1, 2);\n    domain('B', [404, 460, 450, 425, 510, 410, 570, 330], -1, 3);\n    domain('C', [398, 565, 350, 560, 290, 540, 215, 480], 1, 4);\n    domain('D', [406, 550, 460, 540, 520, 520, 590, 455], -1, 5);\n\n    /* Branche centrale : information et numérique */\n    const N1 = [402, 445, 388, 380, 420, 280, 398, 150];\n    const N1t0 = twig(N1, 0.48, -38, 90, 14);\n    const N1t1 = twig(N1, 0.7, 40, 75, -12);\n    const N1t2 = twig(N1, 0.28, 40, 70, -12);\n    addCurve(N1, 'E', 1.9, 3, 36, true);\n    [N1t0, N1t1, N1t2].forEach((c) => addCurve(c, 'E', 1.2, 4, 26, false));\n    leaf(N1, 0.62, -1, 'E');\n    leaf(N1, 1, 0, 'E');\n    leaf(N1t0, 1, 0, 'E');\n    leaf(N1t1, 1, 0, 'E');\n    leaf(N1t2, 1, 0, 'E');\n    slots.E = [[N1, 0.4, -18], [N1t0, 0.6, -14], [N1, 0.82, 16], [N1t1, 0.6, 14], [N1t2, 0.6, 12]];\n    labels.push({ k: 'E', t: 'Numérique', x: 398, y: 102, anchor: 'middle' });\n\n    /* Deux branches hautes, de part et d'autre de la branche centrale */\n    domain('F', [400, 450, 376, 392, 356, 300, 338, 215], -1, 4);\n    domain('G', [405, 448, 440, 395, 466, 300, 500, 200], 1, 5);\n\n    /* Racines : quatre racines, chacune avec ses radicelles */\n    const RT = this.rootsData();\n    const rdef = {\n      rHi: [396, 704, 360, 735, 300, 752, 225, 800],\n      rCo: [399, 704, 385, 770, 350, 830, 318, 885],\n      rLi: [401, 704, 415, 770, 450, 830, 482, 885],\n      rTr: [404, 704, 440, 735, 500, 752, 575, 800]\n    };\n    const rlpos = [];\n    RT.forEach((rt) => {\n      const c = rdef[rt.k];\n      addCurve(c, rt.k, 1.5, 0, 28, true);\n      const n = rt.items.length;\n      rt.items.forEach((it, i) => {\n        const t = 0.3 + (0.62 * i) / Math.max(1, n - 1);\n        const side = i % 2 === 0 ? 1 : -1;\n        const tw = twig(c, t, side * (48 + rnd() * 12), 48 + rnd() * 16, side * 10);\n        addCurve(tw, rt.k, 0.9, 1, 0, false);\n        const v = dv(tw, 1), L = Math.hypot(v.x, v.y) || 1;\n        rlpos.push({ x: r1(tw[6]), y: r1(tw[7]), left: v.x / L < 0 });\n      });\n    });\n\n    labels.push({ k: 'socle', t: 'Tronc', x: 480, y: 650, anchor: 'start' });\n    labels.push({ k: 'rHi', t: 'Histoire', x: 215, y: 812, anchor: 'end' });\n    labels.push({ k: 'rCo', t: 'Cosmovision', x: 318, y: 916, anchor: 'middle' });\n    labels.push({ k: 'rLi', t: 'Littérature', x: 482, y: 916, anchor: 'middle' });\n    labels.push({ k: 'rTr', t: 'Traditions', x: 586, y: 812, anchor: 'start' });\n\n    const C = this.contents();\n    const leafData = pos.map((p, i) => {\n      const c = C[i];\n      return Object.assign({ id: 'f' + (i + 1) }, c, { mg: '', vocab: [] });\n    });\n\n    this._g = { vis: vis, hits: hits, pos: pos, labels: labels, slots: slots, leafData: leafData, rlpos: rlpos, pt: pt, dv: dv, full: full };\n    return this._g;\n  }\n\n  /* ---------- actions ---------- */\n  select(k) {\n    this.setState({ sel: k, section: 'arbre' });\n    if (typeof window !== 'undefined' && window.innerWidth < 900) {\n      setTimeout(() => {\n        const el = document.getElementById('panneau');\n        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n      } iat', E: 'Information et numérique', F: 'Sociologie des organisations', G: 'Arts et monde créatif' };\n    const domDesc = {\n      A: 'Comment une société rend ses règles et ses promesses contraignantes.',\n      B: 'Comment un groupe décide ensemble malgré ses désaccords. Mécanismes de décision, pouvoirs, courants d’idées.',\n      C: 'Comment on produit, on échange, et comment l’argent circule dans le temps.',\n      D: 'Comment transformer un problème en réponse qui tient dans la durée.',\n      E: 'Comment se forme ce qu’on croit savoir, et comment le numérique le transforme.',\n      F: 'Comment les groupes organisés fonctionnent : répartir les tâches, coordonner, diriger, administrer. Management, administration, bureaucratie.',\n      G: 'Comment on crée, on montre et on partage : arts, artisanat, musique, écriture, image. Choix, forme, public, métier.'\n    };\n    const domNote = {\n      A: 'Ces contenus aident à comprendre et ne remplacent pas un conseil juridique.',\n      B: 'Les courants d’idées sont présentés sans prendre parti.',\n      C: 'Ces contenus aident à comprendre et ne remplacent pas un conseil financier. Les exemples chiffrés sont fictifs.',\n      D: 'Les exemples sont fictifs.',\n      E: '',\n      F: '',\n      G: ''\n    };\n    const selK = s.sel === 'trunk' ? 'socle' : s.sel.indexOf('root:') === 0 ? 'r' + s.sel.slice(5) : s.sel.indexOf('branch:') === 0 ? s.sel.slice(7) : '';\n    const keyOf = (k) => (k === 'socle' ? 'trunk' : /^r[A-Z]/.test(k) ? 'root:' + k.slice(1) : 'branch:' + k);\n    const ROOTNOTE = '';\n    const RT = this.rootsData();\n    const rlFlat = [];\n    RT.forEach((rt) => rt.items.forEach((x) => rlFlat.push(Object.assign({ root: rt }, x))));\n    const onTree = true;\n    const inArbre = s.section === 'arbre';\n    const gsec = s.section;\n    const rootsOn = gsec === 'racines', branchesOn = gsec === 'branches';\n    const isOn = (k) => (rootsOn && /^r[A-Z]/.test(k)) || (branchesOn && ['A', 'B', 'C', 'D', 'E', 'F'
