<body>
  <div id="__bundler_placeholder">Loading L&#39;Arbre...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

G,.tree:has(.hit.k-socle:hover) .lbl.k-socle,.tree:has(.hit.k-rHi:hover) .lbl.k-rHi,.tree:has(.hit.k-rCo:hover) .lbl.k-rCo,.tree:has(.hit.k-rLi:hover) .lbl.k-rLi,.tree:has(.hit.k-rTr:hover) .lbl.k-rTr{fill:#e8edf6}\n\n.leaf,.flower{cursor:pointer}\n.leaf .lv{fill:rgba(111,220,255,0);stroke:#7fdcff;stroke-opacity:.8;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round;transition:fill .3s,stroke .3s,stroke-opacity .3s}\n.leaf .rib{fill:none;stroke:#7fdcff;stroke-opacity:.35;stroke-width:.9;stroke-linecap:round}\n.leaf:hover .lv,.leaf:focus-visible .lv,.leaf.sel .lv{fill:rgba(111,220,255,.16);stroke:#c4f4ff;stroke-opacity:1}\n.leaf:focus-visible,.flower:focus-visible,.lbl:focus-visible{outline:2px solid #8fe6ff;outline-offset:2px}\n.flower .pt,.flower .fr{fill:rgba(160,160,255,0);stroke:url(#irid);stroke-width:1.2;stroke-linejoin:round;transition:fill .3s}\n.flower .fr{fill:rgba(170,160,255,.1)}\n.flower .ct{fill:none;stroke:url(#irid);stroke-width:1.2}\n.flower .pet{filter:drop-shadow(0 0 3px rgba(140,160,255,.55));transform-box:fill-box;transform-origin:center}\n.flower:hover .pt,.flower:focus-visible .pt,.flower.sel .pt{fill:rgba(170,160,255,.18)}\n.flower:hover .fr,.flower:focus-visible .fr,.flower.sel .fr{fill:rgba(170,160,255,.26)}\n.flower.sel .pt,.flower.sel .fr{stroke-width:1.6}\n.halo{fill:none;stroke:#9fb4ff;stroke-opacity:0;stroke-width:1;transform-box:fill-box;transform-origin:center}\n\n.rl{cursor:pointer}\n.rl .rn{fill:rgba(111,220,255,0);stroke:#7fdcff;stroke-opacity:.8;stroke-width:1.2;transition:fill .3s,stroke .3s}\n.rl .rtx{fill:#c3cddd;opacity:0;transition:opacity .25s;pointer-events:none}\n.rl:hover .rn,.rl:focus-visible .rn,.rl.sel .rn{fill:rgba(111,220,255,.22);stroke:#c4f4ff;stroke-opacity:1}\n.rl:hover .rtx,.rl:focus-visible .rtx,.rl.sel .rtx{opacity:1}\n.rl:focus-visible{outline:2px solid #8fe6ff;outline-offset:2px}\n\n.vis.on{stroke:#aeeaff;stroke-opacity:1;filter:drop-shadow(0 0 5px rgba(120,230,255,.8))}\n.leaf.on .lv{fill:rgba(111,220,255,.16);stroke:#c4f4ff;stroke-opacity:1}\n.rl.on .rn{fill:rgba(111,220,255,.22);stroke:#c4f4ff;stroke-opacity:1}\n.rl.on .rtx{opacity:1}\n.lbl.on{fill:#e8edf6}\n.flower.on .pet{filter:drop-shadow(0 0 8px rgba(170,190,255,.95))}\n.flower.on .pt,.flower.on .fr{fill:rgba(170,160,255,.22)}\n.zone{fill:rgba(111,220,255,.04);stroke:#7fdcff;stroke-opacity:.5;stroke-dasharray:3 4;stroke-width:1.2;cursor:pointer;transition:all .3s}\n.zone:hover,.zone.pick{stroke-opacity:1;fill:rgba(111,220,255,.16);filter:drop-shadow(0 0 6px rgba(120,230,255,.85))}\n.zone:focus-visible{outline:2px solid #8fe6ff}\n\n.treebox{transition:filter .5s,opacity .5s}\n.fm .treebox{position:fixed!important;top:0;left:0;width:100%!important;height:100%;flex:none!important;z-index:0;filter:blur(7px);opacity:.22;pointer-events:none}\n.fm aside{position:relative;z-index:1;flex:1 1 100%!important;max-width:none!important;padding:24px clamp(16px,6vw,140px) 64px!important}\n.fm aside>*{max-width:740px;margin-left:auto;margin-right:auto}\n.fm header{position:relative;z-index:2}\n\n.dd{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:rgba(111,220,255,.04);border:1px solid rgba(148,163,189,.3);color:#e8edf6;font-size:15.5px;font-weight:300;padding:0 16px;min-height:46px;border-radius:10px;text-align:left;transition:border-color .25s,background .25s}\n.dd:hover{border-color:rgba(111,220,255,.6);background:rgba(111,220,255,.07)}\n.ddc{flex:none;color:#94a3bd;transition:transform .25s}\n.ddc.open{transform:rotate(180deg)}\n.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;background:#0a1226;border:1px solid rgba(111,220,255,.35);border-radius:10px;padding:6px;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.45);max-height:300px;overflow-y:auto}\n.ddo{background:none;border:0;color:#c3cddd;font-size:15px;font-weight:300;text-align:left;padding:0 12px;min-height:44px;border-radius:7px;transition:background .2s,color .2s}\n.ddo: omposés<\u002Ftext>\n                  <text class=\"t2\" x=\"262\" y=\"130\">intérêt simple<\u002Ftext>\n                <\u002Fsvg>\n              <\u002Fsc-if>\n              <sc-if value=\"{{p.f.marge}}\" hint-placeholder-val=\"{{false}}\">\n                <svg class=\"fg\" sc-camel-view-box=\"0 0 360 200\" role=\"img\" aria-label=\"Un prix de vente de 1 000 Ar se compose d'un coût de 600 Ar et d'une marge de 400 Ar\">\n                  <path class=\"l\" d=\"M40 76 L40 66 L320 66 L320 76\"><\u002Fpath>\n                  <text x=\"180\" y=\"52\">prix de vente : 1 000 Ar<\u002Ftext>\n                  <rect class=\"l s\" x=\"40\" y=\"92\" width=\"168\" height=\"48\" rx=\"4\"><\u002Frect>\n                  <rect class=\"l s2\" x=\"208\" y=\"92\" width=\"112\" height=\"48\" rx=\"4\"><\u002Frect>\n                  <text x=\"124\" y=\"121\">coût : 600 Ar<\u002Ftext>\n                  <text x=\"264\" y=\"121\">marge : 400 Ar<\u002Ftext>\n                  <text class=\"t2\" x=\"180\" y=\"172\">avant de compter le transport et le temps de travail<\u002Ftext>\n                <\u002Fsvg>\n              <\u002Fsc-if>\n              <figcaption style=\"margin:0;font-size:13.5px;line-height:1.5;color:#8fa0bb\">{{p.figCap}}<\u002Ffigcaption>\n            <\u002Ffigure>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{p.hasQ}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span class=\"lab\">Question<\u002Fspan>\n              <p style=\"margin:0;font-size:18px;line-height:1.5;color:#e8edf6;font-weight:300;text-wrap:balance\">{{p.q}}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{p.paras}}\" as=\"q\" hint-placeholder-count=\"1\">\n              <p style=\"margin:0;font-size:16.5px;line-height:1.65;color:#c3cddd;font-weight:300;text-wrap:pretty\">{{q.t}}<\u002Fp>\n            <\u002Fsc-for>\n            <sc-for list=\"{{p.secs}}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;flex-direction:column;gap:3px\">\n                <span class=\"lab\">{{s.h}}<\u002Fspan>\n                <p style=\"margin:0;font-size:16px;line-height:1.6;color:#c3cddd;font-weight:300;text-wrap:pretty\">{{s.t}}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{p.hasDial}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <span class=\"lab\">Mise en regard<\u002Fspan>\n              <p style=\"margin:0;font-size:16px;line-height:1.6;color:#c3cddd;font-weight:300;text-wrap:pretty\">{{p.dial}}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{p.hasDraw}}\" hint-placeholder-val=\"{{false}}\">\n            <svg class=\"fg\" sc-camel-view-box=\"0 0 320 200\" role=\"img\" aria-label=\"Dessin joint à la création\" style=\"border:1px solid rgba(148,163,189,.2);border-radius:8px;background:rgba(111,220,255,.025)\">\n              <path d=\"{{p.drawD}}\" fill=\"none\" stroke=\"#aeeaff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{p.hasSchema}}\" hint-placeholder-val=\"{{false}}\">\n            <svg class=\"fg\" sc-camel-view-box=\"0 0 360 260\" role=\"img\" aria-label=\"Schéma joint à la création\" style=\"border:1px solid rgba(148,163,189,.2);border-radius:8px;background:rgba(111,220,255,.025)\">\n              <sc-for list=\"{{p.sLines}}\" as=\"k\" hint-placeholder-count=\"2\">\n                <g>\n                  <path class=\"lk\" d=\"{{k.d}}\" marker-end=\"{{k.me}}\" marker-start=\"{{k.ms}}\"><\u002Fpath>\n                  <text class=\"lt\" x=\"{{k.lx}}\" y=\"{{k.ly}}\" fill=\"#c3cddd\" font-size=\"11.5\" text-anchor=\"middle\" stroke=\"#08101f\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">{{k.label}}<\u002Ftext>\n                <\u002Fg>\n              <\u002Fsc-for>\n              <sc-for list=\"{{p.sNodes}}\" as=\"n\" hint-placeholder-count=\"3\">\n                <g class=\"nd {{n.cls}}\">\n                  <rect x=\"{{n.x}}\" y=\"{{n.y}}\" width=\"{{n.w}}\" height=\"{{n.h}}\" rx=\"{{n.rx}}\"><\u002Frect>\n                  <text class=\"ntx\" x=\"{{n.tx}}\" y=\"{{n.ty}}\" fill=\"#e8edf6\" font-size=\"{{n.fs}}\" text-anchor=\"middle\">{{n.t}}<\u002Ftext>\n                <\u002Fg>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{p.hasAmorce}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:14.5px;font-weight:400;color:#9fe5ff\">Amorce créative<\u002Fspan>\n              <p style=\"margin:0;font-size:16px;line-height:1.6;color:#e8edf6;font-weight:300;text-wrap:pretty\">{{p.amorce}}<\u002Fp>\n              <div><button class=\"btn\" sc-camel-on-click=\"{{p.goAmorce}}\">Répondre à cette amorce<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          \n          <sc-if value=\"{{p.hasNote}}\" hint-placeholder-val=\"{{false}}\">\n            <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#8fa0bb;text-wrap:pretty\">{{p.note}}<\u002Fp>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{p.hasRel}}\" hint-placeholder-val=\"{{true}}\">\n            <div style=\"display:flex;flex-direction:column\">\n              <p style=\"margin:0 0 4px;font-size:14.5px;font-weight:400;color:#8fa0bb\">{{p.relTitle}}<\u002Fp>\n              <sc-for list=\"{{p.rel}}\" as=\"r\" hint-placeholder-count=\"3\">\n                <button class=\"rel\" sc-camel-on-click=\"{{r.pick}}\"><span style=\"font-size:16.5px\">{{r.title}}<\u002Fspan><span style=\"font-size:13.5px;color:#8fa0bb\">{{r.sub}}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:4px\">\n            <button class=\"btn\" sc-camel-on-click=\"{{p.a1}}\">{{p.a1L}}<\u002Fbutton>\n            <sc-if value=\"{{p.hasA2}}\" hint-placeholder-val=\"{{true}}\">\n              <button class=\"btn2\" sc-camel-on-click=\"{{p.a2}}\">{{p.a2L}}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{p.noSel}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <h2 style=\"margin:0;font-size:30px;font-weight:300;line-height:1.15;text-wrap:balance\">Un arbre pour penser<\u002Fh2>\n          <p style=\"margin:0;font-size:16.5px;line-height:1.65;color:#c3cddd;text-wrap:pretty\">Les racines portent l'identité malgache, le Tronc donne les outils de pensée communs à tous, les branches sont des domaines que l'on choisit, les feuilles des contenus, les fleurs vos créations, les fruits vos projets réels.<\u002Fp>\n          <p style=\"margin:0;font-size:16.5px;line-height:1.65;color:#c3cddd;text-wrap:pretty\">Rien n'est obligatoire : choisissez une feuille, une branche, ou commencez par le Tronc.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center\">\n            <button class=\"btn\" sc-camel-on-click=\"{{openTronc}}\">Découvrir le Tronc<\u002Fbutton>\n            <button class=\"btn2\" sc-camel-on-click=\"{{goSac}}\">Créer une réflexion<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{isRacines}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <h1 style=\"margin:0;font-size:30px;font-weight:300\">Les Racines<\u002Fh1>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#94a3bd;max-width:62ch;text-wrap:pretty\">Les racines portent l'identité malgache. Quatre racines, chacune avec ses radicelles.<\u002Fp>\n    <\u002Fdiv>\n    <sc-for list=\"{{rootCards}}\" as=\"r\" hint-placeholder-count=\"4\">\n      <section style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px\">\n          <h2 style=\"margin:0;font-size:28px;font-weight:300\">{{r.name}}<\u002Fh2>\n          <button class=\"btn2\" sc-camel-on-click=\"{{r.pick}}\">Voir sur l'arbre<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:16.5px;line-height:1.6;color:#c3cddd;max-width:66ch;text-wrap:pretty\">{{r.desc}}<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(148,163,189,.14);margin-top:6px\">\n          <sc-for list=\"{{r.items}}\" as=\"it\" hint-placeholder-count=\"4\">\n            <button class=\"rel\" sc-camel-on-click=\"{{it.pick}}\" style=\"gap:6px 24px;padding:14px 0;align-items:baseline\">\n              <span style=\"flex:0 1 230px;font-size:20px;font-weight:300;line-height:1.3\">{{it.title}}<\u002Fspan>\n              <span style=\"flex:2 1 280px;font-size:15px;color:#94a3bd;line-height:1.5\">{{it.sum}}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{isBranches}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <h1 style=\"margin:0;font-size:30px;font-weight:300\">Les Branches<\u002Fh1>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#94a3bd;max-width:62ch;text-wrap:pretty\">Sept domaines transversaux, que l'on choisit librement. Chaque branche porte ses feuilles : des idées fondatrices et des contenus à explorer.<\u002Fp>\n    <\u002Fdiv>\n    <sc-for list=\"{{branchCards}}\" as=\"r\" hint-placeholder-count=\"5\">\n      <section style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px\">\n          <h2 style=\"margin:0;font-size:28px;font-weight:300\">{{r.name}}<\u002Fh2>\n          <button class=\"btn2\" sc-camel-on-click=\"{{r.pick}}\">Voir sur l'arbre<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:16.5px;line-height:1.6;color:#c3cddd;max-width:66ch;text-wrap:pretty\">{{r.desc}}<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(148,163,189,.14);margin-top:6px\">\n          <sc-for list=\"{{r.items}}\" as=\"it\" hint-placeholder-count=\"5\">\n            <button class=\"rel\" sc-camel-on-click=\"{{it.pick}}\" style=\"gap:6px 24px;padding:14px 0;align-items:baseline\">\n              <span style=\"flex:1 1 250px;font-size:20px;font-weight:300;line-height:1.3\">{{it.title}}<\u002Fspan>\n              <span style=\"flex:0 1 150px;font-size:14.5px;font-weight:400;color:#9fe5ff\">{{it.fmt}}<\u002Fspan>\n              <span style=\"flex:2 1 280px;font-size:15px;color:#94a3bd;line-height:1.5\">{{it.sum}}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{isSac}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <h1 style=\"margin:0;font-size:30px;font-weight:300\">Faire éclore des fleurs<\u002Fh1>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#94a3bd;max-width:62ch;text-wrap:pretty\">Un espace pour créer librement. Chaque création fait fleurir l'Arbre.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:40px\">\n      <section aria-label=\"Nouvelle création\" style=\"min-width:0;display:flex;flex-direction:column;gap:26px\">\n        <h2 style=\"margin:0;font-size:24px;font-weight:300\">Nouvelle création<\u002Fh2>\n\n        <div role=\"group\" aria-label=\"Choisir une amorce\" style=\"display:flex;flex-direction:column;gap:10px\">\n          <span class=\"lab\">Une amorce pour commencer, ou aucune<\u002Fspan>\n          <div style=\"position:relative\">\n            <button class=\"dd\" aria-haspopup=\"listbox\" aria-expanded=\"{{amExpanded}}\" sc-camel-on-click=\"{{toggleAm}}\">\n              <span>{{amLabel}}<\u002Fspan>\n              <svg class=\"ddc {{amCls}}\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M2 5 L7 10 L12 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <sc-if value=\"{{amOpen}}\" hint-placeholder-val=\"{{false}}\">\n              <div class=\"ddl\" role=\"listbox\" aria-label=\"Amorces\">\n                <sc-for list=\"{{amorceChips}}\" as=\"c\" hint-placeholder-count=\"7\">\n                  <button class=\"ddo {{c.on}}\" role=\"option\" aria-selected=\"{{c.pressed}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.l}}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{hasPrompt}}\" hint-placeholder-val=\"{{false}}\">\n            <p style=\"margin:4px 0 0;font-size:17px;line-height:1.55;color:#e8edf6;text-wrap:pretty\">{{dPrompt}}<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center\">\n            <sc-if value=\"{{hasOthers}}\" hint-placeholder-val=\"{{false}}\">\n              <button class=\"btn2\" sc-camel-on-click=\"{{toggleOthers}}\">{{othersLabel}}<\u002Fbutton>\n            <\u002Fsc-if>\n            <button class=\"btn2\" sc-camel-on-click=\"{{goArbre}}\">Explorer sans rien créer<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{showOthers}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <sc-for list=\"{{others}}\" as=\"o\" hint-placeholder-count=\"2\">\n                <div style=\"padding:10px 0;border-bottom:1px solid rgba(148,163,189,.12)\">\n                  <span class=\"lab\">{{o.by}}<\u002Fspan>\n                  <p style=\"margin:2px 0 0;font-size:15.5px;line-height:1.5;color:#c3cddd\">{{o.t}}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <p style=\"margin:8px 0 0;font-size:13px;color:#8fa0bb\">Quelques exemples de réponses.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <label for=\"champ-titre\" class=\"lab\">Titre<\u002Flabel>\n          <input id=\"champ-titre\" class=\"fld\" type=\"text\" placeholder=\"Sans titre\" value=\"{{dTitle}}\" sc-camel-on-input=\"{{onTitle}}\" sc-camel-on-change=\"{{onTitle}}\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <label for=\"champ-texte\" class=\"lab\">Votre réflexion<\u002Flabel>\n          <textarea id=\"champ-texte\" class=\"area\" rows=\"5\" placeholder=\"Ce qui vous vient, sans plan.\" value=\"{{dText}}\" sc-camel-on-input=\"{{onText}}\" sc-camel-on-change=\"{{onText}}\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span class=\"lab\">Dessin ou schéma, facultatif<\u002Fspan>\n          <div role=\"group\" aria-label=\"Type de figure\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{toolChips}}\" as=\"c\" hint-placeholder-count=\"2\">\n              <button class=\"chip {{c.on}}\" aria-pressed=\"{{c.pressed}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.l}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{isDraw}}\" hint-placeholder-val=\"{{true}}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <svg class=\"pad\" sc-camel-view-box=\"0 0 320 200\" role=\"img\" aria-label=\"Zone de dessin libre\" sc-camel-on-pointer-down=\"{{padDown}}\" sc-camel-on-pointer-move=\"{{padMove}}\" sc-camel-on-pointer-up=\"{{padUp}}\" sc-camel-on-pointer-leave=\"{{padUp}}\">\n                <path d=\"{{padD}}\"><\u002Fpath>\n              <\u002Fsvg>\n              <div><button class=\"btn2\" sc-camel-on-click=\"{{padClear}}\">Effacer le dessin<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{isSchema}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n                <button class=\"btn\" sc-camel-on-click=\"{{addNode}}\">Ajouter une bulle<\u002Fbutton>\n                <button class=\"chip {{modeMoveOn}}\" sc-camel-on-click=\"{{setMove}}\">Déplacer<\u002Fbutton>\n                <button class=\"chip {{modeLinkOn}}\" sc-camel-on-click=\"{{setLink}}\">Relier<\u002Fbutton>\n                <button class=\"btn2\" sc-camel-on-click=\"{{undo}}\">Annuler<\u002Fbutton>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.5;color:#8fa0bb\">{{schemaHint}}<\u002Fp>\n              <svg class=\"pad\" sc-camel-view-box=\"0 0 360 260\" role=\"group\" aria-label=\"Zone de schéma\" sc-camel-on-pointer-down=\"{{schDown}}\" sc-camel-on-pointer-move=\"{{schMove}}\" sc-camel-on-pointer-up=\"{{schUp}}\" sc-camel-on-pointer-leave=\"{{schUp}}\">\n                <sc-for list=\"{{schLines}}\" as=\"k\" hint-placeholder-count=\"2\">\n                  <g>\n                    <path class=\"lk {{k.sel}}\" d=\"{{k.d}}\" marker-end=\"{{k.me}}\" marker-start=\"{{k.ms}}\"><\u002Fpath>\n                    <path class=\"lh\" d=\"{{k.d}}\" sc-camel-on-pointer-down=\"{{k.down}}\"><\u002Fpath>\n                    <text class=\"lt\" x=\"{{k.lx}}\" y=\"{{k.ly}}\" fill=\"#c3cddd\" font-size=\"11.5\" text-anchor=\"middle\" stroke=\"#08101f\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">{{k.label}}<\u002Ftext>\n                  <\u002Fg>\n                <\u002Fsc-for>\n                <sc-for list=\"{{schNodes}}\" as=\"n\" hint-placeholder-count=\"3\">\n                  <g class=\"nd {{n.cls}}\" sc-camel-on-pointer-down=\"{{n.down}}\">\n                    <rect x=\"{{n.x}}\" y=\"{{n.y}}\" width=\"{{n.w}}\" height=\"{{n.h}}\" rx=\"{{n.rx}}\"><\u002Frect>\n                    <text class=\"ntx\" x=\"{{n.tx}}\" y=\"{{n.ty}}\" fill=\"#e8edf6\" font-size=\"{{n.fs}}\" text-anchor=\"middle\">{{n.t}}<\u002Ftext>\n                  <\u002Fg>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n\n              <sc-if value=\"{{hasSelNode}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(148,163,189,.14);padding-top:12px\">\n                  <label for=\"champ-bulle\" class=\"lab\">Texte de la bulle<\u002Flabel>\n                  <input id=\"champ-bulle\" class=\"fld sm\" type=\"text\" maxlength=\"26\" value=\"{{nText}}\" sc-camel-on-input=\"{{onNText}}\" sc-camel-on-change=\"{{onNText}}\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:0 8px\">\n                    <button class=\"btn2\" sc-camel-on-click=\"{{toggleBig}}\">{{nBigL}}<\u002Fbutton>\n                    <button class=\"btn2\" sc-camel-on-click=\"{{delNode}}\">Supprimer la bulle<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{hasSelLink}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(148,163,189,.14);padding-top:12px\">\n                  <span class=\"lab\">{{lTitle}}<\u002Fspan>\n                  <div role=\"group\" aria-label=\"Flèches\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                    <sc-for list=\"{{dirChips}}\" as=\"c\" hint-placeholder-count=\"4\">\n                      <button class=\"chip {{c.on}}\" aria-pressed=\"{{c.pressed}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.l}}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <label for=\"champ-lien\" class=\"lab\">Texte sur le lien, facultatif<\u002Flabel>\n                  <input id=\"champ-lien\" class=\"fld sm\" type=\"text\" maxlength=\"18\" value=\"{{lLabel}}\" sc-camel-on-input=\"{{onLLabel}}\" sc-camel-on-change=\"{{onLLabel}}\">\n                  <div><button class=\"btn2\" sc-camel-on-click=\"{{delLink}}\">Supprimer le lien<\u002Fbutton><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div role=\"group\" aria-label=\"Lier à\" style=\"display:flex;flex-direction:column;gap:10px\">\n          <span class=\"lab\">Lier à<\u002Fspan>\n          <div style=\"position:relative\">\n            <button class=\"dd\" aria-haspopup=\"listbox\" aria-expanded=\"{{anExpanded}}\" sc-camel-on-click=\"{{toggleAn}}\">\n              <span>{{anLabel}}<\u002Fspan>\n              <svg class=\"ddc {{anCls}}\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M2 5 L7 10 L12 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <sc-if value=\"{{anOpen}}\" hint-placeholder-val=\"{{false}}\">\n
